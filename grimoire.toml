# Grimoire book configuration for the @deckyard/virtualbox documentation.

[book]
title = "@deckyard/virtualbox"
description = "Oracle VirtualBox 7 through VBoxManage: inventories, VM lifecycle, power, snapshots, clones, OVA import and export, guest control"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "nordic"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://deckyard.github.io/deck-virtualbox/"
repoUrl = "https://github.com/deckyard/deck-virtualbox"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-virtualbox/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
